<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon-movie.png">
    <title>Watch the movie Fight Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen text-white bg-[radial-gradient(ellipse_at_bottom_right,_#300,_#000_60%)]">

    <!-- NAVBAR -->
    <header class="fixed top-0 z-50 w-full bg-black/80 backdrop-blur border-b border-white/10">
      <nav class="flex items-center justify-between px-5 py-4 max-w-7xl mx-auto">
        <!-- Logo + Nav grouped left -->
        <div class="flex items-center gap-8">
        <a href="index.html" class="text-xl sm:text-2xl text-pink-500 font-extrabold tracking-tight hover:scale-105 transition shrink-0">
          FIGHT CLUB
        </a>
        <ul class="hidden md:flex items-center gap-6 text-sm">
          <li><a href="index.html" class="hover:text-blue-400 transition">Home</a></li>
          <li><a href="movie.html" class="hover:text-blue-400 transition">Movie</a></li>
          <li class="relative group">
            <button class="hover:text-blue-400 transition px-2 py-1">Values ▾</button>
            <ul class="absolute top-full left-0 mt-2 w-44 bg-black/90 border border-white/10 rounded-lg overflow-hidden opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 shadow-xl">
              <li><a href="theories.html" class="block px-4 py-2.5 hover:text-blue-400 hover:bg-white/5 transition">Theories</a></li>
              <li><a href="rules.html" class="block px-4 py-2.5 hover:text-blue-400 hover:bg-white/5 transition">Rules</a></li>
              <li><a href="characters.html" class="block px-4 py-2.5 hover:text-blue-400 hover:bg-white/5 transition">Characters</a></li>
            </ul>
          </li>
        </ul>
        </div>

        <!-- Desktop search -->
        <form class="hidden md:flex items-center gap-2">
          <input type="search" placeholder="Search"
            class="bg-transparent border border-white/40 text-white px-3 py-1.5 rounded-md text-sm placeholder-white/60 focus:outline-none focus:border-white hover:border-pink-400 transition w-36 lg:w-48" />
          <button type="submit"
            class="border border-white/40 text-white hover:border-pink-400 px-3 py-1.5 rounded-md text-sm hover:text-pink-400 hover:font-bold transition">Search</button>
        </form>
        <button id="menuBtn" aria-label="Open menu" class="md:hidden flex flex-col gap-1.5 p-2">
          <span class="block w-6 h-0.5 bg-white"></span>
          <span class="block w-6 h-0.5 bg-white"></span>
          <span class="block w-6 h-0.5 bg-white"></span>
        </button>
      </nav>
      <aside id="mobileMenu" class="hidden md:hidden bg-black/95 border-t border-white/10 px-5 pb-6 pt-4 space-y-4">
        <form class="flex gap-2 mb-4">
          <input type="search" placeholder="Search"
            class="flex-1 bg-transparent border border-white/40 text-white px-3 py-2 rounded-md text-sm placeholder-white/60 focus:outline-none focus:border-white" />
          <button type="submit"
            class="border border-white/40 text-white px-3 py-2 rounded-md text-sm hover:text-pink-400 hover:border-pink-400 transition">Search</button>
        </form>
        <a href="index.html" class="block py-2 hover:text-blue-400 transition border-b border-white/10">Home</a>
        <a href="movie.html" class="block py-2 hover:text-blue-400 transition border-b border-white/10">Movie</a>
        <p class="text-white/40 text-xs uppercase tracking-widest pt-1">Values</p>
        <a href="theories.html" class="block py-2 pl-3 hover:text-blue-400 transition border-b border-white/10">Theories</a>
        <a href="rules.html" class="block py-2 pl-3 hover:text-blue-400 transition border-b border-white/10">Rules</a>
        <a href="characters.html" class="block py-2 pl-3 hover:text-blue-400 transition">Characters</a>
      </aside>
    </header>

    <script>
      const btn = document.getElementById('menuBtn');
      const menu = document.getElementById('mobileMenu');
      btn.addEventListener('click', () => menu.classList.toggle('hidden'));
    </script>

    <main class="min-h-screen">
      <section class="w-full min-h-screen flex flex-col items-center justify-center gap-8 sm:gap-10 pt-24 px-5">

        <img
          src="movieone.jpg"
          class="w-full max-w-3xl aspect-video object-cover rounded-xl shadow-xl border border-black"
          alt="Fight Club movie poster"
        />

        <nav class="flex flex-col sm:flex-row gap-4 sm:gap-8 w-full max-w-md sm:max-w-none sm:w-auto">
          <a href="https://archive.org/details/fight.club.10th.anniversary.edition.1999.1080p.brrip.x264.yify_201908"
            class="btn btn-lg btn-outline border border-pink-400 hover:bg-pink-500/20 hover:border-pink-900 cursor-pointer text-center"
            target="_blank">
            I'll watch the movie
          </a>
          <a href="ballcancer.html"
            class="btn btn-lg btn-outline cursor-pointer border border-blue-400 hover:bg-blue-500/30 hover:border-blue-900 hover:text-white text-center">
            I won't watch the movie
