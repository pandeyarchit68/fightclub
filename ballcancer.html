<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Call</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  </head>

  <body class="bg-black overflow-hidden">
    <main class="relative h-screen w-screen flex items-center justify-center">

      <figure class="relative h-screen w-full">
        <img src="jackcancer.jpg" alt="Incoming Call" class="h-full w-full object-contain" />

        <!-- CALLER INFO -->
        <header class="absolute top-12 sm:top-16 w-full text-center cursor-none px-4">
          <h1 class="text-white text-4xl sm:text-5xl font-bold animate__animated animate__fadeInDown">
            Ball Cancer
          </h1>
          <h2 class="text-white text-xl sm:text-2xl mt-2 animate__animated animate__fadeInDown animate__delay-2s">
            Incoming Call...
          </h2>
        </header>

        <!-- REJECT CALL -->
        <figure class="absolute bottom-0 left-1/2 flex flex-col items-center gap-1 cursor-pointer">
          <img src="reject.png" class="w-32 sm:w-42 h-48 sm:h-72 animate__animated animate__pulse animate__slow animate__infinite" alt="Reject" />
        </figure>

        <!-- ACCEPT CALL -->
        <figure class="absolute bottom-0 right-1/2 flex flex-col items-center gap-1 cursor-pointer">
          <img src="accept.png" class="w-32 sm:w-42 h-48 sm:h-72 animate__animated animate__pulse animate__slow animate__infinite" alt="Accept" />
        </figure>
      </figure>

    </main>
  </body>
</html>
